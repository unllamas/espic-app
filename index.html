   💾 PERSISTENCIA LOCAL (localStorage) — separación contenido / personal

const LS = {
  // Información personal (NO se borra al limpiar caché de contenido)
  PROFILE:'immersia.profile', ATTEMPTS:'immersia.attempts', RECORDINGS:'immersia.recordings',
  SAVED:'immersia.savedPhrases', PROGRESS:'immersia.progress', METRICS:'immersia.metrics',
  SESSION:'immersia.currentSession',
  // Contenido descargable (puede eliminarse y re-descargarse)
  PACKAGES:'immersia.packages', AUDIO_CACHE:'immersia.audioAssets',
};
const load = (k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const save = (k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ toast('Sin espacio suficiente en el dispositivo','alert-triangle','bad'); } };

let state = {
  profile:   load(LS.PROFILE, null),
  packages:  load(LS.PACKAGES, {}),          // {pkgId:{...package, downloadedAt}}
  saved:     load(LS.SAVED, []),             // saved phrases
  attempts:  load(LS.ATTEMPTS, []),
  recordings:load(LS.RECORDINGS, []),
  progress:  load(LS.PROGRESS, { started:[], completed:[], minutes:0, activities:0, categories:{} }),
  metrics:   load(LS.METRICS, {}),
  session:   load(LS.SESSION, null),
  tab:'today',
  online:navigator.onLine,
  ob:{ step:0, data:{} },
  ttsRate:1,
  audio:{ key:null, status:'idle' },
};
// Migra perfiles guardados por versiones anteriores al único par admitido.
if(state.profile){
  state.profile.sourceLanguage='es';
  state.profile.targetLanguage='en';
  state.profile.targetLocale='en-US';
  delete state.profile.targetDate;
  if(!VOICE_PROFILES.some(v=>v.id===state.profile.preferredVoice)){
    state.profile.preferredVoice='voice-girl';
  }
}

function persist(){
  save(LS.PROFILE,state.profile); save(LS.PACKAGES,state.packages); save(LS.SAVED,state.saved);
  save(LS.ATTEMPTS,state.attempts); save(LS.RECORDINGS,state.recordings); save(LS.PROGRESS,state.progress);
  save(LS.METRICS,state.metrics); save(LS.SESSION,state.session);
}

/* 📊 Métricas de validación (sección 21) — en producción se envían a ANALYTICS_ENDPOINT */
function track(event){
  state.metrics[event]=(state.metrics[event]||0)+1; save(LS.METRICS,state.metrics);
  if(!CONFIG.DEMO_MODE){ /* fetch(CONFIG.ANALYTICS_ENDPOINT,{method:'POST',headers:{'x-api-key':CONFIG.ANALYTICS_KEY},body:JSON.stringify({event,ts:Date.now()})}) */ }
}

/* =====================================================================
   🔊 AUDIO — TTS (ElevenLabs mediante backend seguro)
   ===================================================================== */
let currentUtterance=null, currentAudio=null, currentTtsController=null, ttsRequestId=0;
const ttsMemoryCache=new Map();
const ttsKey=(speechText,voiceRef,opts={})=>JSON.stringify([speechText,voiceRef,!!opts.slow]);

function setAudioState(key,status){
  state.audio={key,status};
  render();
}

function toggleTTSFromButton(payload){
  const [speechText,voiceRef,opts]=JSON.parse(decodeURIComponent(payload));
  const key=ttsKey(speechText,voiceRef,opts);
  if(state.audio.key===key&&state.audio.status==='playing') stopTTS();
  else playTTS(speechText,voiceRef,opts);
}

async function playTTS(speechText, voiceRef, opts={}){
  stopTTS(false);
  const requestId=++ttsRequestId;
  const key=ttsKey(speechText,voiceRef,opts);
  setAudioState(key,'loading');
  track('audio_played');
  if(CONFIG.DEMO_MODE){
    const u=new SpeechSynthesisUtterance(speechText);
    const vp=VOICE_PROFILES.find(v=>v.id===voiceRef);
    u.lang = vp ? vp.locale : 'en-US';
    const voices=speechSynthesis.getVoices();
    const match=voices.find(v=>v.lang.replace('_','-')===u.lang)||voices.find(v=>v.lang.startsWith(u.lang.split('-')[0]));
    if(match) u.voice=match;
    u.rate = opts.slow ? 0.65 : state.ttsRate;
    u.onstart=()=>{ if(requestId===ttsRequestId) setAudioState(key,'playing'); };
    u.onend=()=>{ if(requestId===ttsRequestId){ currentUtterance=null; setAudioState(null,'idle'); } };
    u.onerror=()=>{ if(requestId===ttsRequestId){ currentUtterance=null; setAudioState(null,'idle'); } };
    currentUtterance=u;
    speechSynthesis.speak(u);
  } else {
    const vp=VOICE_PROFILES.find(v=>v.id===voiceRef) ||
      VOICE_PROFILES.find(v=>v.id===state.profile?.preferredVoice);
    if(!vp){
      setAudioState(null,'idle');
      toast('No se encontró la voz seleccionada.','volume-x','bad');
      return;
    }
    const cacheKey=JSON.stringify([speechText,vp.id,CONFIG.ELEVENLABS_MODEL,opts.slow]);
    try{
      let audioUrl=ttsMemoryCache.get(cacheKey);
      if(!audioUrl){
        currentTtsController=new AbortController();
        const response=await fetch(CONFIG.TTS_PROXY_URL,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          signal:currentTtsController.signal,
          body:JSON.stringify({
            text:speechText,
            voiceId:vp.providerVoiceId,
            modelId:CONFIG.ELEVENLABS_MODEL,
            outputFormat:CONFIG.TTS_OUTPUT_FORMAT,
            voiceSettings:{...vp.settings,speed:opts.slow?0.75:1}
          })
        });
        if(!response.ok){
          const detail=await response.text();
          throw new Error(detail||`Error ${response.status}`);
        }
        const blob=await response.blob();
        if(!blob.type.startsWith('audio/')) throw new Error('El servidor no devolvió audio.');
        audioUrl=URL.createObjectURL(blob);
        ttsMemoryCache.set(cacheKey,audioUrl);
      }
      if(requestId!==ttsRequestId) return;
      currentTtsController=null;
      currentAudio=new Audio(audioUrl);
      currentAudio.onended=()=>{ if(requestId===ttsRequestId){ currentAudio=null; setAudioState(null,'idle'); } };
      currentAudio.onerror=()=>{ if(requestId===ttsRequestId){ currentAudio=null; setAudioState(null,'idle'); } };
      await currentAudio.play();
      setAudioState(key,'playing');
    }catch(error){
      currentTtsController=null;
      if(requestId===ttsRequestId) setAudioState(null,'idle');
      if(error.name==='AbortError') return;
      console.error('No se pudo reproducir ElevenLabs:',error);
      let message='No se pudo generar el audio.';
      try{
        const parsed=JSON.parse(error.message);
        message=parsed.error||message;
      }catch{}
      toast(message,'volume-x','bad');
    }
  }
}
function stopTTS(shouldRender=true){
  ttsRequestId++;
  if(currentTtsController){ currentTtsController.abort(); currentTtsController=null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(currentAudio){ currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
  currentUtterance=null;
  state.audio={key:null,status:'idle'};
  if(shouldRender) render();
}

/* 🎙️ Grabación */
let mediaRecorder=null, recChunks=[], recTimer=null, recSeconds=0;
async function startRecording(onTick){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[]; recSeconds=0;
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>recChunks.push(e.data);
    mediaRecorder.start();
    recTimer=setInterval(()=>{ recSeconds++; onTick&&onTick(recSeconds); },1000);
    return true;
  }catch(e){ return false; } // micrófono bloqueado
}
function stopRecording(){
  return new Promise(res=>{
    if(!mediaRecorder){ res(null); return; }
    clearInterval(recTimer);
    mediaRecorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:'audio/webm'});
      mediaRecorder.stream.getTracks().forEach(t=>t.stop());
      const reader=new FileReader();
      reader.onload=()=>res({dataUrl:reader.result, duration:recSeconds});
      reader.readAsDataURL(blob);
    };
    mediaRecorder.stop(); mediaRecorder=null;
  });
}

function downloadPackage(pkgId){
  // 🔴 PRODUCCIÓN: fetch(`${CONFIG.API_BASE_URL}/packages/${pkgId}`) + descarga de audio assets desde CONFIG.CDN_AUDIO_BASE
  const app=$('#app');
  app.innerHTML=`<div class="min-h-screen flex flex-col items-center justify-center px-8 text-center fade-in">
    <div class="w-16 h-16 rounded-2xl bg-brand-50 flex items-center justify-center mb-5"><i data-lucide="download-cloud" class="w-8 h-8 text-brand-500"></i></div>
    <h2 class="font-bold text-lg">Descargando paquete…</h2>

    <div class="w-full max-w-xs h-2 bg-ink-100 rounded-full mt-6 overflow-hidden"><div id="dl-bar" class="h-full bg-brand-500 rounded-full transition-all duration-200" style="width:0%"></div></div>
    <p id="dl-pct" class="text-xs text-ink-400 mt-2">0%</p>
  </div>`; icons();
  let p=0;
  const t=setInterval(()=>{
    p=Math.min(100,p+Math.random()*22);
    $('#dl-bar').style.width=p+'%'; $('#dl-pct').textContent=Math.round(p)+'%';
    if(p>=100){
      clearInterval(t);
      if(pkgId===SEED_PACKAGE.id){
        state.packages[pkgId]={...SEED_PACKAGE, downloadedAt:new Date().toISOString()};
      } else {
        const m=REMOTE_MANIFEST.packages.find(x=>x.id===pkgId);
        state.packages[pkgId]={...m, schemaVersion:'1.0', description:'Paquete adicional (contenido de ejemplo).', scenarios:[], downloadedAt:new Date().toISOString()};
      }
      track('package_downloaded'); persist();
      state.tab='today'; toast('Paquete descargado y disponible sin conexión','check-circle-2','good'); render();
    }
  },180);
}

function checkUpdates(){
  // 🔴 PRODUCCIÓN: fetch(CONFIG.MANIFEST_URL) → comparar versiones → descargar deltas
  if(!state.online){ toast('Sin conexión: se mantiene el contenido actual','wifi-off','accent'); return; }

function toggleSavePhrase(phraseId, scenarioId){
  const i=state.saved.findIndex(p=>p.phraseId===phraseId);
  if(i>=0){ state.saved.splice(i,1); toast('Frase quitada de tu banco','bookmark-minus'); }
  else{
    state.saved.push({ phraseId, scenarioId, savedAt:new Date().toISOString(),
      reviewState:'new', nextReview:new Date(Date.now()+86400000).toISOString(), notes:'' });
    track('phrase_saved'); toast('Frase guardada en tu banco de frases','bookmark-check','good');
  }
  persist(); render();
}
function findPhrase(id){
  for(const p of Object.values(state.packages)) for(const s of (p.scenarios||[])){
    const ph=(s.phrases||[]).find(x=>x.id===id); if(ph) return {phrase:ph, scenario:s};
  } return null;
}
function markReviewed(phraseId){
  const sp=state.saved.find(p=>p.phraseId===phraseId); if(!sp) return;
  const steps={new:2, learning:5, review:12}; // días (repaso espaciado simple)
  sp.reviewState = sp.reviewState==='new'?'learning': sp.reviewState==='learning'?'review':'review';
  sp.nextReview=new Date(Date.now()+ (steps[sp.reviewState]||3)*86400000).toISOString();
  persist(); toast('Repaso registrado','check','good'); render();
}

/* =====================================================================
   🎬 SESIÓN — Context → Learn → Listen → Understand → Respond → Review
   ===================================================================== */
const SESSION_STEPS=['context','learn','listen','understand','respond','review'];
function startSession(scenarioId){
  const sc=findScenario(scenarioId);
  if(!sc){ toast('Escenario no disponible sin conexión','cloud-off','bad'); return; }
  state.session={ scenarioId, step:0, startedAt:Date.now(), answers:{}, recording:null, transcript:null, writtenResponse:'' };
  if(!state.progress.started.includes(scenarioId)) state.progress.started.push(scenarioId);
  track('session_started'); persist(); render();
}
function sessionScenario(){ return state.session?findScenario(state.session.scenarioId):null; }
function sessionNext(){
  if(!state.session) return;
  if(state.session.step<SESSION_STEPS.length-1){ state.session.step++; persist(); render(); }
  else completeSession();
}
function sessionBack(){
  if(!state.session) return;
  if(state.session.step>0){ state.session.step--; persist(); render(); }
  else exitSession();
}
function exitSession(){
  stopTTS();
  if(mediaRecorder){ try{ mediaRecorder.stop(); }catch(e){} mediaRecorder=null; }
  clearInterval(recTimer);
  state.session=null; persist(); render();
}
function setSessionAnswer(activityId,value){
  state.session.answers[activityId]=value; persist(); render();
}
function submitChoice(activityId){
  const sc=sessionScenario();
  const act=sc?.activities?.find(a=>a.id===activityId);
  const selected=state.session?.answers?.[activityId];
  if(!act||selected===undefined){ toast('Elegí una opción antes de continuar','circle-alert','accent'); return; }
  const correct=selected===act.expected;
  state.session.answers[activityId]={value:selected,correct,submitted:true};
  state.attempts.push({scenarioId:sc.id,activityId,type:'choice',answer:selected,correct,createdAt:new Date().toISOString()});
  state.progress.activities++;
  track('activity_answered'); persist(); render();
}
function choiceValue(activityId){
  const a=state.session?.answers?.[activityId];
  return a&&typeof a==='object'?a.value:a;
}
async function toggleSessionRecording(){
  if(mediaRecorder){
    const result=await stopRecording();
    if(result){
      state.session.recording=result;
      state.recordings.push({scenarioId:state.session.scenarioId,dataUrl:result.dataUrl,duration:result.duration,createdAt:new Date().toISOString()});
      track('recording_created'); persist(); render();
    }
    return;
  }
  const ok=await startRecording(()=>{
    const el=$('#rec-time'); if(el) el.textContent=formatSeconds(recSeconds);
  });
  if(!ok){ toast('No se pudo acceder al micrófono','mic-off','bad'); return; }
  render();
}
function formatSeconds(n){ return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`; }
function saveWrittenResponse(v){ state.session.writtenResponse=v; persist(); }
function markResponded(){
  if(!state.session) return;
  const hasRecording=!!state.session.recording;
  const hasText=!!state.session.writtenResponse?.trim();
  if(!hasRecording&&!hasText){ toast('Grabá o escribí una respuesta para continuar','mic','accent'); return; }
  if(!state.session.respondedAt){
    state.session.respondedAt=Date.now();
    track('session_responded');
    state.progress.activities++;
    state.attempts.push({scenarioId:state.session.scenarioId,activityId:'speaking-response',type:hasRecording?'speaking':'written',answer:hasText?state.session.writtenResponse:'[audio]',correct:null,createdAt:new Date().toISOString()});
  }
  persist(); sessionNext();
}
function completeSession(){
  const sc=sessionScenario(); if(!sc){ exitSession(); return; }
  const elapsed=Math.max(1,Math.round((Date.now()-state.session.startedAt)/60000));
  if(!state.progress.completed.includes(sc.id)) state.progress.completed.push(sc.id);
  state.progress.minutes+=elapsed;
  state.progress.categories[sc.category]=(state.progress.categories[sc.category]||0)+1;
  track('session_completed');
  state.session=null; persist();
  toast('¡Sesión completada!','party-popper','good');
  state.tab='today'; render();
}
function sessionTop(sc,step){
  const pct=Math.round((state.session.step+1)/SESSION_STEPS.length*100);
  return `<div class="sticky top-0 z-30 bg-ink-50/95 backdrop-blur border-b border-ink-100">
    <div class="px-4 pt-4 pb-3 flex items-center gap-3">
      <button onclick="sessionBack()" class="w-9 h-9 rounded-full bg-white border border-ink-200 flex items-center justify-center shrink-0"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
      <div class="flex-1 min-w-0"><p class="text-xs text-ink-400 truncate">${esc(sc.title)}</p><div class="h-1.5 bg-ink-100 rounded-full mt-1.5 overflow-hidden"><div class="h-full bg-brand-500 rounded-full" style="width:${pct}%"></div></div></div>
      <span class="text-xs font-bold text-ink-400">${state.session.step+1}/${SESSION_STEPS.length}</span>
    </div>
  </div>`;
}
function primaryButton(label,action,icon='arrow-right',disabled=false){
  return `<button onclick="${action}" ${disabled?'disabled':''} class="w-full py-3.5 rounded-2xl font-semibold flex items-center justify-center gap-2 ${disabled?'bg-ink-100 text-ink-400':'bg-brand-600 text-white hover:bg-brand-700'}">${esc(label)}<i data-lucide="${icon}" class="w-4 h-4"></i></button>`;
}
function renderSession(){
  const sc=sessionScenario();
  if(!sc){ state.session=null; persist(); return renderToday()+renderNav(); }
  const step=SESSION_STEPS[state.session.step];
  let body='';
  if(step==='context') body=renderSessionContext(sc);
  if(step==='learn') body=renderSessionLearn(sc);
  if(step==='listen') body=renderSessionListen(sc);
  if(step==='understand') body=renderSessionUnderstand(sc);
  if(step==='respond') body=renderSessionRespond(sc);
  if(step==='review') body=renderSessionReview(sc);
  return sessionTop(sc,step)+`<main class="px-5 py-5 fade-in">${body}</main>`;
}
function renderSessionContext(sc){
  const c=catInfo(sc.category);
  return `<div>
    <div class="flex gap-1.5 mb-3">${chip(c.label)}${chip(sc.level,'bg-brand-50 text-brand-700')}${chip(sc.estimatedMinutes+' min')}</div>
    <h2 class="text-2xl font-bold leading-tight">${esc(sc.title)}</h2>
    <p class="text-sm text-ink-500 mt-3 leading-relaxed">${esc(sc.description)}</p>
    <div class="bg-white rounded-2xl border border-ink-100 p-4 mt-5">
      <p class="text-xs font-semibold text-ink-500 uppercase tracking-wide mb-3">Objetivos</p>
      <div class="space-y-2">${sc.objectives.map(o=>`<div class="flex gap-2.5"><i data-lucide="check-circle-2" class="w-4 h-4 text-good-500 mt-0.5 shrink-0"></i><p class="text-sm">${esc(o)}</p></div>`).join('')}</div>
    </div>
    <div class="mt-6">${primaryButton('Entrar en la situación','sessionNext()','arrow-right')}</div>
  </div>`;
}
function renderSessionLearn(sc){
  return `<div>
    <p class="text-xs font-semibold text-brand-600 uppercase tracking-wide">Aprender</p>
    <h2 class="text-xl font-bold mt-1">Frases clave</h2>
    <p class="text-sm text-ink-500 mt-1 mb-4">Escuchá, entendé y guardá las que quieras practicar después.</p>
    <div class="space-y-3">${sc.phrases.map(ph=>`<div class="bg-white rounded-2xl border border-ink-100 p-4">
      <div class="flex items-start gap-3"><div class="flex-1"><p class="font-semibold text-sm leading-snug">${esc(ph.text)}</p><p class="text-xs text-brand-600 mt-1">${esc(ph.translation)}</p><p class="text-xs text-ink-400 mt-2 leading-relaxed">${esc(ph.explanation)}</p></div>
      <div class="flex flex-col gap-2">${audioButton(ph.speechText,sc.actors[0]?.voiceRef||state.profile.preferredVoice)}
      <button onclick="toggleSavePhrase('${ph.id}','${sc.id}')" class="w-9 h-9 rounded-xl ${isPhraseSaved(ph.id)?'bg-brand-600 text-white':'bg-ink-50 text-ink-400'} flex items-center justify-center"><i data-lucide="bookmark" class="w-4 h-4"></i></button></div></div>
    </div>`).join('')}</div>
    <div class="mt-6">${primaryButton('Continuar','sessionNext()')}</div>
  </div>`;
}
function renderSessionListen(sc){
  return `<div>
    <p class="text-xs font-semibold text-brand-600 uppercase tracking-wide">Escuchar</p>
    <h2 class="text-xl font-bold mt-1">Escuchá la conversación</h2>
    <p class="text-sm text-ink-500 mt-1 mb-4">Reproducí cada intervención. Podés usar velocidad lenta.</p>
    <div class="space-y-3">${sc.dialogue.sort((a,b)=>a.sortOrder-b.sortOrder).map((dl,i)=>{
      const actor=sc.actors.find(a=>a.id===dl.actorId)||{name:'Hablante',voiceRef:state.profile.preferredVoice};
      return `<div class="bg-white rounded-2xl border border-ink-100 p-4"><div class="flex items-center justify-between gap-2"><p class="text-xs font-bold text-brand-600">${esc(actor.name)}</p><div class="flex gap-2">${audioButton(dl.speechText,actor.voiceRef,{slow:true},{size:'w-8 h-8',icon:'turtle',idleClass:'bg-ink-50 text-ink-500 hover:bg-ink-100',label:'Reproducir lentamente'})}${audioButton(dl.speechText,actor.voiceRef,{},{size:'w-8 h-8'})}</div></div><p class="text-sm font-medium mt-2 leading-relaxed">${esc(dl.text)}</p><details class="mt-2"><summary class="text-xs text-ink-400 cursor-pointer">Ver traducción</summary><p class="text-xs text-ink-500 mt-1">${esc(dl.translation)}</p>${dl.metadata?.culture?`<p class="text-xs text-accent-500 mt-2">${esc(dl.metadata.culture)}</p>`:''}</details></div>`;
    }).join('')}</div>
    <div class="mt-6">${primaryButton('Comprobar comprensión','sessionNext()')}</div>
  </div>`;
}
function renderSessionUnderstand(sc){
  const act=sc.activities.find(a=>a.type==='choice');
  if(!act) return `<p class="text-sm text-ink-500">No hay actividad de comprensión.</p><div class="mt-6">${primaryButton('Continuar','sessionNext()')}</div>`;
  const ans=state.session.answers[act.id]; const selected=choiceValue(act.id); const submitted=ans&&typeof ans==='object'&&ans.submitted;
  return `<div><p class="text-xs font-semibold text-brand-600 uppercase tracking-wide">Comprender</p><h2 class="text-xl font-bold mt-1">${esc(act.instructions)}</h2>
    <div class="space-y-2 mt-5">${act.content.options.map(opt=>{const sel=selected===opt;let cls=sel?'border-brand-500 ring-2 ring-brand-500/10':'border-ink-100';if(submitted&&sel)cls=ans.correct?'border-good-500 bg-good-500/5':'border-bad-500 bg-bad-500/5';return `<button ${submitted?'disabled':''} onclick='setSessionAnswer(${JSON.stringify(act.id)},${JSON.stringify(opt)})' class="w-full text-left bg-white border-2 ${cls} rounded-2xl p-4 text-sm font-medium flex items-center justify-between"><span>${esc(opt)}</span>${sel?`<i data-lucide="${submitted?(ans.correct?'check-circle-2':'x-circle'):'circle-dot'}" class="w-5 h-5 ${submitted?(ans.correct?'text-good-500':'text-bad-500'):'text-brand-500'}"></i>`:''}</button>`}).join('')}</div>
    ${submitted?`<div class="mt-4 rounded-2xl p-4 ${ans.correct?'bg-good-500/10 text-good-500':'bg-bad-500/10 text-bad-500'}"><p class="text-sm font-semibold">${esc(ans.correct?act.feedback.correct:act.feedback.incorrect)}</p></div>`:''}
    <div class="mt-6">${submitted?primaryButton('Continuar','sessionNext()'):primaryButton('Comprobar','submitChoice('+JSON.stringify(act.id)+')','check',selected===undefined)}</div></div>`;
}
function renderSessionRespond(sc){
  const act=sc.activities.find(a=>a.type==='speaking'); const recording=state.session.recording;
  return `<div><p class="text-xs font-semibold text-brand-600 uppercase tracking-wide">Responder</p><h2 class="text-xl font-bold mt-1">Tu turno de hablar</h2><p class="text-sm text-ink-500 mt-2 leading-relaxed">${esc(act?.instructions||'Respondé con tus propias palabras.')}</p>
    ${act?.content?.prompt?`<div class="bg-ink-900 text-white rounded-2xl p-4 mt-4"><p class="text-xs text-ink-400 mb-1">Te dicen:</p><p class="font-semibold">${esc(act.content.prompt)}</p></div>`:''}
    <div class="mt-5 bg-white rounded-3xl border border-ink-100 p-5 text-center">
      <button onclick="toggleSessionRecording()" class="mx-auto w-20 h-20 rounded-full ${mediaRecorder?'bg-bad-500 text-white pulse-rec':'bg-brand-600 text-white'} flex items-center justify-center shadow-lg"><i data-lucide="${mediaRecorder?'square':'mic'}" class="w-8 h-8"></i></button>
      <p id="rec-time" class="text-lg font-bold mt-3">${mediaRecorder?formatSeconds(recSeconds):recording?formatSeconds(recording.duration):'00:00'}</p><p class="text-xs text-ink-400 mt-1">${mediaRecorder?'Grabando… tocá para detener':recording?'Grabación lista. Podés repetirla.':'Tocá para grabar tu respuesta'}</p>
      ${recording?`<audio controls src="${recording.dataUrl}" class="w-full mt-4"></audio>`:''}
    </div>
    <div class="mt-4"><label class="text-xs font-semibold text-ink-500 uppercase tracking-wide">O escribí tu respuesta</label><textarea oninput="saveWrittenResponse(this.value)" class="mt-2 w-full min-h-24 bg-white border border-ink-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="Escribí aquí…">${esc(state.session.writtenResponse||'')}</textarea></div>
    ${act?.content?.hint?`<details class="mt-3"><summary class="text-xs font-semibold text-brand-600 cursor-pointer">Ver una pista</summary><p class="text-xs text-ink-500 bg-brand-50 rounded-xl p-3 mt-2">${esc(act.content.hint)}</p></details>`:''}
    <div class="mt-6">${primaryButton('Enviar respuesta','markResponded()','send')}</div></div>`;
}
function renderSessionReview(sc){
  const choice=sc.activities.find(a=>a.type==='choice'); const a=choice?state.session.answers[choice.id]:null;
  return `<div class="text-center"><div class="w-20 h-20 mx-auto rounded-full bg-good-500/10 flex items-center justify-center"><i data-lucide="sparkles" class="w-10 h-10 text-good-500"></i></div><h2 class="text-2xl font-bold mt-5">¡Buen trabajo!</h2><p class="text-sm text-ink-500 mt-2">Completaste la práctica activa de esta situación.</p>
    <div class="grid grid-cols-2 gap-3 mt-6 text-left"><div class="bg-white rounded-2xl border border-ink-100 p-4"><i data-lucide="message-circle" class="w-5 h-5 text-brand-500 mb-2"></i><p class="font-bold text-lg">${sc.phrases.length}</p><p class="text-xs text-ink-400">frases vistas</p></div><div class="bg-white rounded-2xl border border-ink-100 p-4"><i data-lucide="brain" class="w-5 h-5 text-brand-500 mb-2"></i><p class="font-bold text-lg">${a?.correct?'✓':'—'}</p><p class="text-xs text-ink-400">comprensión</p></div></div>
    <div class="bg-white rounded-2xl border border-ink-100 p-4 mt-4 text-left"><p class="text-xs font-semibold text-ink-500 uppercase tracking-wide mb-2">Recordatorio cultural</p><p class="text-sm text-ink-600">Hablar, pedir repetición y confirmar lo entendido vale más que buscar una respuesta perfecta.</p></div>
    <div class="mt-6">${primaryButton('Completar sesión','completeSession()','check')}</div></div>`;
}

/* =====================================================================
   🌐 ESTADO DE RED + ARRANQUE
   ===================================================================== */
window.addEventListener('online',()=>{ state.online=true; toast('Conexión restablecida','wifi','good'); render(); });
window.addEventListener('offline',()=>{ state.online=false; toast('Modo sin conexión activo','wifi-off','accent'); render(); });
window.addEventListener('beforeunload',persist);
if('speechSynthesis' in window) speechSynthesis.getVoices();
render();
</script>
</body>
</html>
